plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid'
}

android {
    namespace 'com.bgmi'
    compileSdk 34
buildToolsVersion '34.0.0'
    signingConfigs {
        debug {
            storeFile file("zen.jks")
            storePassword "TWINZZZGODD@6"
            keyPassword "TWINZZZGODD@6"
            keyAlias "SLAYTWINZ@66"
        }
        release {
            storeFile file("zen.jks")
            storePassword "TWINZZZGODD@6"
            keyPassword "TWINZZZGODD@6"
            keyAlias "SLAYTWINZ@66"
            v1SigningEnabled false
            v2SigningEnabled true
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.visionpro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.05"
        vectorDrawables { useSupportLibrary true }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'none' }
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    lsparanoid {
        seed = 0x0DEA7C0D   // OgCheat seed
        global = true        // encrypt ALL string literals
        includeDependencies = false
        variantFilter = { true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures { viewBinding true }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += [
                '**/libcanvas.so',
                '**/libmsaoaidsec.so',
                '**/libtoolChecker.so',
            ]
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/proguard/**',
                'META-INF/versions/**',
                'okhttp3/**',
                '**.properties',
                '**.proto',
            ]
            pickFirsts += [
                'META-INF/services/**',
            ]
        }
    }
    externalNativeBuild {
        ndkBuild { path file('src/main/jni/Android.mk') }
    }
    ndkVersion "24.0.8215888"
}

dependencies {
    // Hcore AAR via flatDir — works in AndroidIDE + Android Studio
    implementation(name: 'Hcore-release', ext: 'aar')
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
implementation "com.airbnb.android:lottie:6.0.0"
    implementation 'com.google.android.material:material:1.11.0'
}


tasks.whenTaskAdded { task ->
    if (task.name == 'stripReleaseDebugSymbols') {
        task.doLast {
            // Strip Hikari .comment section
            def objcopy = '/root/android-sdk/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy'
            def strippedSo = file("${buildDir}/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/arm64-v8a/libsdk.so")
            if (strippedSo.exists()) {
                exec { commandLine objcopy, '--remove-section=.comment', strippedSo.absolutePath }
                println "[Hikari] Stripped .comment from libsdk.so"
            }

            // Pad libsdk.so so final APK = 8.25 MB (8650752 bytes)
            long targetSoSize = 6977946L
            if (strippedSo.exists() && strippedSo.length() < targetSoSize) {
                long padBytes = targetSoSize - strippedSo.length()
                new RandomAccessFile(strippedSo, "rw").withCloseable { raf ->
                    raf.seek(strippedSo.length())
                    byte[] buf = new byte[(int) padBytes]
                    new java.util.Random(0x5A4B3C2D1E0FL).nextBytes(buf)
                    raf.write(buf)
                }
                println "[Pad] libsdk.so padded +${padBytes} bytes → ${targetSoSize} bytes"
            }
        }
    }
}
