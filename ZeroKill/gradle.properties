#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Fri Mar 06 05:52:41 GMT 2026
android.nonTransitiveRClass=true
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true

# ── R8 full mode OFF — causes I/O crash on AndroidIDE /storage path ──
android.enableR8.fullMode=true

# ── Disable Jetifier — faster build, smaller APK ──
android.enableJetifier=false

# ── Disable incremental dex — avoids stale cache issues ──
android.dexOptions.incremental=false
